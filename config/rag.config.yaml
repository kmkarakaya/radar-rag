server:
  port: 3010
registry:
  path: data/registry.sqlite
chroma:
  url: http://localhost:8000
ollama:
  baseUrl: http://localhost:11434
  embeddingModel: embeddinggemma-2:270m
chat:
  baseUrl: ""
  model: ""
collectionDefaults:
  sourcePath: data
  distanceMetric: l2
  chunkSize: 500
  chunkOverlap: 200
  retrievalK: 5
  retrievalDistanceThreshold: 1.2
  timeoutMs: 180000
readiness:
  timeoutMs: 30000
  embeddingProbeText: Merhaba
  chatProbeText: Orda mısın?
cleanup:
  retentionMs: 3600000
limits:
  maxConcurrentEmbeddings: 5
  maxConcurrentGenerations: 2
rateLimit:
  enabled: true
  windowMs: 60000
  maxRequestsPerWindow: 60
adminAuth:
  enabled: false
  cookieName: rag_admin_session
  sessionTtlMs: 28800000
  actionTokenTtlMs: 300000
  sessionSecretEnvVar: RAG_ADMIN_SESSION_SECRET
  users: []
observability:
  includeDebugTimings: false
