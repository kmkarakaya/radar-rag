  chatModel: gemma3:4b-cloud
  embeddingModel: bge-m3
  numCtx: 4096
  numPredict: 512
collectionDefaults:
  sourcePath: data
  distanceMetric: l2
  chunkSize: 500
  chunkOverlap: 200
  retrievalK: 5
