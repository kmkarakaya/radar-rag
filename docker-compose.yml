# Stack: backend + Chroma. Embeddings run inside the backend by default (built-in model, downloaded on
# the first indexing into ./models); no Ollama is needed.
#
# This file works on its own: download it into an empty folder and run `docker compose up -d`; the
# prebuilt backend image is pulled from ghcr.io. In a clone of the repo, `docker compose up -d --build`
# builds the image from your working copy instead.
#
#   docker compose up -d          # everything
#   docker compose up -d chroma   # only Chroma, for running the backend with `npm run dev`
#
# Open http://localhost:3010/admin. On the first start a "Sample documents" collection is created and
# indexed. Create your own collections there and upload documents in their Documents tab (or with
# POST /v1/admin/collections/<id>/files); they are stored in ./data/collections.
# Optional config file: ./config/rag.config.yaml (every setting has a default; after editing it, run
# `docker compose restart backend`).
# Settings go in a .env file next to this file:
#   BACKEND_HOST_PORT / CHROMA_HOST_PORT   host ports (default 3010 / 8000)
#
# Embedding services: add them in the admin panel (Embedding services) without editing this file or
# restarting. The variables below define the read-only "server" service and the default for NEW collections:
#   built-in (default):    nothing to set
#   Ollama on the host:    RAG_EMBEDDING_PROVIDER=openai-compatible
#                          RAG_EMBEDDING_BASE_URL=http://host.docker.internal:11434/v1
#                          RAG_EMBEDDING_MODEL=embeddinggemma-2:270m
#   cloud provider:        RAG_EMBEDDING_PROVIDER=openai-compatible  RAG_EMBEDDING_BASE_URL=https://api.openai.com/v1
#                          RAG_EMBEDDING_MODEL=text-embedding-3-small  RAG_EMBEDDING_API_KEY=...
#
# Answer generation (/query) is optional; without it the backend is retrieve-only. To enable it,
# point it at any OpenAI-compatible chat API:
#   Ollama on the host:    RAG_CHAT_BASE_URL=http://host.docker.internal:11434/v1  RAG_CHAT_MODEL=gemma3:4b
#   cloud provider:        RAG_CHAT_BASE_URL=https://api.openai.com/v1  RAG_CHAT_MODEL=gpt-4o-mini  RAG_CHAT_API_KEY=...

services:
  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "${CHROMA_HOST_PORT:-8000}:8000"
    volumes:
      - ./chroma_data:/data
    restart: unless-stopped

  backend:
    image: ghcr.io/kmkarakaya/radar-rag:latest
    build: .
    ports:
      - "${BACKEND_HOST_PORT:-3010}:3010"
    environment:
      RAG_CHROMA_URL: http://chroma:8000
      # Embedding default for new collections (empty = the config file's default: built-in).
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      # Optional chat LLM for /query (any OpenAI-compatible API). Empty = retrieve-only.
      RAG_CHAT_BASE_URL: ${RAG_CHAT_BASE_URL:-}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-}
      RAG_CHAT_API_KEY: ${RAG_CHAT_API_KEY:-}
      # Only needed if you enable admin auth in config/rag.config.yaml.
      RAG_ADMIN_SESSION_SECRET: ${RAG_ADMIN_SESSION_SECRET:-}
      # Set to false to skip the sample collection on the first start.
      RAG_SAMPLE_COLLECTION: ${RAG_SAMPLE_COLLECTION:-}
    volumes:
      # Uploaded documents (./data/collections) and the SQLite registry. A collection can also read a
      # folder you put here, with the source path data/<folder>.
      - ./data:/app/data
      # Built-in embedding models, downloaded once on the first indexing and kept across restarts.
      - ./models:/app/models
      # Optional config (config/rag.config.yaml); an empty or missing folder means the defaults.
      # chroma.url is always overridden above; non-empty RAG_EMBEDDING_* / RAG_CHAT_* values override the
      # file too. Inside the container localhost is the container itself: use host.docker.internal.
      - ./config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_started
    restart: unless-stopped
