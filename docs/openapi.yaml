        models:
          type: array
          items:
            type: string
          description: builtin entry only; the built-in models this backend ships.
        readOnly:
          type: boolean
        configured:
          type: boolean
        collectionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    EmbeddingServicesListResponse:
