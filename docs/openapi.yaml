openapi: 3.1.0
info:
  title: Vanilla RAG Backend API
  version: 0.1.0
  description: >
    Machine-readable contract for the current Vanilla RAG Backend implementation.
    This spec covers the versioned public RAG API, admin API, job API, and the
    system health/readiness endpoints. Admin auth is opt-in and uses a signed
    session cookie plus short-lived action tokens for protected mutations.
servers:
  - url: http://localhost:3010
    description: Local development
tags:
  - name: System
  - name: Public RAG
  - name: Admin Auth
  - name: Admin Collections
  - name: Admin Jobs
  - name: Admin Audit
paths:
  /:
    get:
      tags: [System]
      operationId: getRoot
      summary: Service introspection
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: System readiness probe
      parameters:
        - $ref: "#/components/parameters/ReadyDetails"
        - $ref: "#/components/parameters/ReadyStrict"
      responses:
        "200":
          description: Readiness summary or details
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadySummary"
                  - $ref: "#/components/schemas/ReadyDetailsResponse"
        "503":
          description: Returned only when strict=true and the system is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyDetailsResponse"
  /v1/rag/collections:
    get:
      tags: [Public RAG]
      operationId: listPublicCollections
      summary: List public collections visible to the current tenant
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Public collection list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionListResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}:
    get:
      tags: [Public RAG]
      operationId: getPublicCollection
      summary: Get one public collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Public collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionDetailResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/ready:
    get:
      tags: [Public RAG]
      operationId: getCollectionReady
      summary: Get collection-specific readiness and capability state
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Collection readiness payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionReadinessPayload"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/retrieve:
    post:
      tags: [Public RAG]
      operationId: retrieveSources
      summary: Retrieve source chunks and effective embedding model
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieved source chunks and the effective embedding model
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/query:
    post:
      tags: [Public RAG]
      operationId: queryCollection
      summary: Retrieve context, generate a grounded answer, and return model metadata
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Generated answer with sources and effective model metadata
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Create an admin session cookie with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated admin session summary
          headers:
            Set-Cookie:
              description: HttpOnly session cookie scoped to the admin browser session
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    type: object
                    required: [username, role, tenantId, expiresAt]
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        enum: [viewer, operator, admin]
                      tenantId:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /v1/admin/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: adminLogout
      summary: Clear the admin session cookie
      description: >
        Idempotent. Always clears the cookie and returns 204, whether or not a
        valid session is present, so it requires no authentication.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /v1/admin/auth/session:
    get:
      tags: [Admin Auth]
      operationId: adminSession
      summary: Return the current admin session summary
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Current session summary
          content:
            application/json:
              schema:
                type: object
                required: [enabled, authenticated, session]
                properties:
                  enabled:
                    type: boolean
                  authenticated:
                    type: boolean
                  session:
                    anyOf:
                      - type: "null"
                      - type: object
                        required: [username, role, tenantId, expiresAt]
                        properties:
                          username:
                            type: string
                          role:
                            type: string
                            enum: [viewer, operator, admin]
                          tenantId:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/auth/action-token:
    post:
      tags: [Admin Auth]
      operationId: adminActionToken
      summary: Mint a short-lived signed token for a mutating admin route
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, path]
              additionalProperties: false
              properties:
                method:
                  type: string
                path:
                  type: string
      responses:
        "200":
          description: Signed action token and expiry timestamp
          content:
            application/json:
              schema:
                type: object
                required: [actionToken, expiresAt]
                properties:
                  actionToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections:
    post:
      tags: [Admin Collections]
      operationId: createCollection
      summary: Create a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          description: >-
            UNAVAILABLE_MODEL. The embedding or chat model is not pulled in Ollama; nothing is created.
            details.missingModels, details.availableModels and details.recommendedActions explain the fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: OLLAMA_UNREACHABLE. Ollama could not be reached to verify the models; nothing is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/validate:
    post:
      tags: [Admin Collections]
      operationId: validateCreateCollection
      summary: Validate a create draft without mutating state
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/config/defaults:
    get:
      tags: [Admin Collections]
      operationId: getAdminConfigDefaults
      summary: Get create-form runtime defaults
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runtime defaults for the admin create form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigDefaultsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/models:
    get:
      tags: [Admin Collections]
      operationId: listAdminModels
      summary: Discover Ollama models for admin autocomplete with soft-fail behavior
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Ollama model inventory; empty lists and reachable=false indicate discovery soft-fail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelDiscoveryResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}:
    get:
      tags: [Admin Collections]
      operationId: getAdminCollection
      summary: Get the full editable collection DTO
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Full collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    patch:
      tags: [Admin Collections]
      operationId: patchCollection
      summary: Update a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Admin Collections]
      operationId: deleteCollection
      summary: Soft-delete a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/physical-collections:
    get:
      tags: [Admin Collections]
      operationId: listAdminPhysicalCollections
      summary: List physical collection lifecycle records for one logical collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Physical collection lifecycle list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPhysicalCollectionsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/validate:
    post:
      tags: [Admin Collections]
      operationId: validateUpdateCollection
      summary: Validate an update draft against a persisted collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/reindex:
    post:
      tags: [Admin Collections]
      operationId: reindexCollection
      summary: Start an asynchronous reindex job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "202":
          description: Reindex accepted
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexAcceptedResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          description: >-
            UNAVAILABLE_MODEL. The collection's embedding model is not pulled in Ollama; no job is started.
            The chat model is not required to reindex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: OLLAMA_UNREACHABLE. Ollama could not be reached to verify the embedding model; no job is started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs:
    get:
      tags: [Admin Jobs]
      operationId: listJobs
      summary: List tenant-visible jobs
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobCollectionId"
        - $ref: "#/components/parameters/JobStatus"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobCursor"
      responses:
        "200":
          description: Job list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobListResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/audit-log:
    get:
      tags: [Admin Audit]
      operationId: listAuditLog
      summary: List persisted operational audit log entries
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - name: collectionId
          in: query
          required: false
          description: Exact collection filter. Repeat the parameter to filter by multiple collections. When provided, collection visibility is validated with the same tenant-scoped rules as other admin collection routes, one collection at a time.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: operation
          in: query
          required: false
          description: Exact operation filter. Repeat the parameter to match any selected operation.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Audit log list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/bulk-delete:
    post:
      tags: [Admin Jobs]
      operationId: bulkDeleteJobs
      summary: Delete multiple terminal jobs
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteJobsRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}:
    get:
      tags: [Admin Jobs]
      operationId: getJob
      summary: Get one job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job detail
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleJobResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Admin Jobs]
      operationId: deleteJob
      summary: Delete one terminal job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}/events:
    get:
      tags: [Admin Jobs]
      operationId: listJobEvents
      summary: Get the persisted event timeline for one job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job event timeline
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [Admin Jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
components:
  headers:
    XRateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: string
    XRateLimitRemaining:
      description: Remaining allowed requests in the current window.
      schema:
        type: string
    XRateLimitReset:
      description: ISO timestamp when the current rate-limit window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until the client should retry the rate-limited request.
      schema:
        type: string
    CacheControlNoStore:
      description: Returned as no-store for job endpoints.
      schema:
        type: string
  parameters:
    XTenantId:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant scope. Defaults to default when omitted. When admin auth is enabled on /v1/admin routes, the backend derives tenant scope from the authenticated session and ignores this header.
      schema:
        type: string
    XUserId:
      name: x-user-id
      in: header
      required: false
      description: User identity for rate limiting and logs. Defaults to local-dev when omitted. When admin auth is enabled on /v1/admin routes, the backend derives user identity from the authenticated session and ignores this header.
      schema:
        type: string
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Optional request correlation ID. Generated automatically when omitted.
      schema:
        type: string
    XAdminActionToken:
      name: x-admin-action-token
      in: header
      required: false
      description: Required on POST/PATCH/DELETE admin mutations when admin auth is enabled, except login, logout, and validation-only endpoints.
      schema:
        type: string
    ReadyDetails:
      name: details
      in: query
      required: false
      schema:
        type: boolean
      description: Return the full readiness payload when true.
    ReadyStrict:
      name: strict
      in: query
      required: false
      schema:
        type: boolean
      description: Return HTTP 503 when the system is not ready.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    JobCollectionId:
      name: collectionId
      in: query
      required: false
      schema:
        type: string
    JobStatus:
      name: status
      in: query
      required: false
      description: >
        Job status filter. The implementation accepts repeated params and comma-separated values.
      schema:
        oneOf:
          - type: string
            enum: [queued, running, succeeded, failed, cancelled]
          - type: array
            items:
              type: string
              enum: [queued, running, succeeded, failed, cancelled]
      style: form
      explode: true
    JobLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    JobCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    ApiError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NoContent:
      description: No content
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: rag_admin_session
  schemas:
    ApiErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - INVALID_REQUEST_BODY
            - COLLECTION_FORBIDDEN
            - COLLECTION_NOT_FOUND
            - COLLECTION_NOT_READY
            - COLLECTION_INDEX_ALREADY_RUNNING
            - NO_RELEVANT_CONTEXT
            - ANSWER_NOT_IN_RETRIEVED_CONTEXT
            - DISALLOWED_FALLBACK_ANSWER
            - COLLECTION_INDEXING
            - COLLECTION_STORAGE_INCONSISTENT
            - MODEL_BACKPRESSURE
            - INVALID_JOB_STATUS
            - UNAVAILABLE_MODEL
            - OLLAMA_UNREACHABLE
            - RATE_LIMIT_EXCEEDED
            - UNAUTHORIZED
            - FORBIDDEN
            - EMPTY_MODEL_RESPONSE
            - ROUTE_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    RootResponse:
      type: object
      required: [name, status, message, endpoints]
      properties:
        name:
          type: string
        status:
          type: string
          const: ok
        message:
          type: string
        endpoints:
          type: object
          required: [health, ready, adminCollections, collections, query, retrieve, testFrontend]
          properties:
            health:
              type: string
            ready:
              type: string
            adminCollections:
              type: string
            collections:
              type: string
            query:
              type: string
            retrieve:
              type: string
            testFrontend:
              type: string
    HealthResponse:
      type: object
      required: [status, alive, port, uptimeSec, timestamp]
      properties:
        status:
          type: string
          const: ok
        alive:
          type: boolean
        port:
          type: integer
        uptimeSec:
          type: number
        timestamp:
          type: string
          format: date-time
    ReadinessIssueSummary:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
    ReadySummary:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - queryReady
        - indexReady
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - blockers
        - warnings
        - dependencies
        - config
        - diagnostics
        - operations
        - operationalAlerts
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        systemReadyFor:
          type: string
          enum: [query-and-index, query, index, neither]
        overallSummary:
          type: string
        queryReady:
          type: boolean
        indexReady:
          type: boolean
        querySummary:
          type: string
        indexSummary:
          type: string
        blockerCodes:
          type: array
          items:
            type: string
        warningCodes:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        dependencies:
          type: object
          required: [registry, chroma, ollama]
          properties:
            registry:
              $ref: "#/components/schemas/DependencyAvailability"
            chroma:
              $ref: "#/components/schemas/DependencyAvailability"
            ollama:
              $ref: "#/components/schemas/DependencyAvailability"
        config:
          type: object
          required: [port, chatModel, embeddingModel, chromaUrl]
          properties:
            port:
              type: integer
            chatModel:
              type: string
            embeddingModel:
              type: string
            chromaUrl:
              type: string
        diagnostics:
          type: object
          required: [full, strictHttpStatus, fullStrict]
          properties:
            full:
              type: string
            strictHttpStatus:
              type: string
            fullStrict:
              type: string
        operations:
          $ref: "#/components/schemas/OperationalSummary"
        operationalAlerts:
          type: array
          items:
            $ref: "#/components/schemas/OperationalAlert"
    ReadyDetailsResponse:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - queryReady
        - indexReady
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - port
        - chatModel
        - embeddingModel
        - chromaUrl
        - chromaLatencyMs
        - capabilities
        - blockers
        - warnings
        - checks
        - dependencies
        - dataSource
        - operations
        - operationalAlerts
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        systemReadyFor:
          type: string
          enum: [query-and-index, query, index, neither]
        overallSummary:
          type: string
        queryReady:
          type: boolean
        indexReady:
          type: boolean
        querySummary:
          type: string
        indexSummary:
          type: string
        blockerCodes:
          type: array
          items:
            type: string
        warningCodes:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        port:
          type: integer
        chatModel:
          type: string
        embeddingModel:
          type: string
        chromaUrl:
          type: string
        chromaLatencyMs:
          type: integer
        capabilities:
          type: object
          required: [query, index]
          properties:
            query:
              $ref: "#/components/schemas/SystemCapabilityState"
            index:
              $ref: "#/components/schemas/SystemCapabilityState"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        dependencies:
          type: object
          required: [chroma, registry, ollama, embeddings, chatGeneration]
          properties:
            chroma:
              type: object
              additionalProperties: true
            registry:
              type: object
              additionalProperties: true
            ollama:
              type: object
              additionalProperties: true
            embeddings:
              type: object
              additionalProperties: true
            chatGeneration:
              type: object
              additionalProperties: true
        dataSource:
          type: object
          additionalProperties: true
        operations:
          $ref: "#/components/schemas/OperationalSummary"
        operationalAlerts:
          type: array
          items:
            $ref: "#/components/schemas/OperationalAlert"
    OperationalSummary:
      type: object
      required: [observedAt, collections, jobs, physicalCollections, runtime]
      properties:
        observedAt:
          type: string
          format: date-time
        collections:
          $ref: "#/components/schemas/OperationalCollectionSummary"
        jobs:
          $ref: "#/components/schemas/OperationalJobSummary"
        physicalCollections:
          $ref: "#/components/schemas/OperationalPhysicalCollectionSummary"
        runtime:
          $ref: "#/components/schemas/OperationalRuntimeSummary"
    OperationalCollectionSummary:
      type: object
      required: [total, creating, indexing, ready, failed, archived]
      properties:
        total:
          type: integer
        creating:
          type: integer
        indexing:
          type: integer
        ready:
          type: integer
        failed:
          type: integer
        archived:
          type: integer
    OperationalJobSummary:
      type: object
      required:
        - total
        - active
        - queued
        - running
        - terminal
        - succeeded
        - failed
        - cancelled
        - oldestActiveUpdatedAt
        - oldestActiveAgeSec
        - newestFailureAt
      properties:
        total:
          type: integer
        active:
          type: integer
        queued:
          type: integer
        running:
          type: integer
        terminal:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        oldestActiveUpdatedAt:
          type: [string, "null"]
          format: date-time
        oldestActiveAgeSec:
          type: [integer, "null"]
        newestFailureAt:
          type: [string, "null"]
          format: date-time
    OperationalPhysicalCollectionSummary:
      type: object
      required:
        - total
        - building
        - active
        - failedBuild
        - deletePending
        - cleanupFailed
        - deleted
        - cleanupBacklog
        - oldestDueDeleteAt
      properties:
        total:
          type: integer
        building:
          type: integer
        active:
          type: integer
        failedBuild:
          type: integer
        deletePending:
          type: integer
        cleanupFailed:
          type: integer
        deleted:
          type: integer
        cleanupBacklog:
          type: integer
        oldestDueDeleteAt:
          type: [string, "null"]
          format: date-time
    OperationalRuntimeSummary:
      type: object
      required: [rateLimit, concurrency, timeouts]
      properties:
        rateLimit:
          type: object
          required: [enabled, windowMs, maxRequestsPerWindow]
          properties:
            enabled:
              type: boolean
            windowMs:
              type: integer
            maxRequestsPerWindow:
              type: integer
        concurrency:
          type: object
          required: [maxConcurrentEmbeddings, maxConcurrentGenerations]
          properties:
            maxConcurrentEmbeddings:
              type: integer
            maxConcurrentGenerations:
              type: integer
        timeouts:
          type: object
          required: [readinessMs, ragMs]
          properties:
            readinessMs:
              type: integer
            ragMs:
              type: integer
    OperationalAlert:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - FAILED_COLLECTIONS_PRESENT
            - FAILED_JOBS_PRESENT
            - CLEANUP_BACKLOG_PRESENT
            - CLEANUP_RETRY_REQUIRED
        severity:
          type: string
          enum: [warn, info]
        message:
          type: string
        recommendedAction:
          type: string
    DependencyAvailability:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    SystemCapabilityState:
      type: object
      required: [ready, message]
      properties:
        ready:
          type: boolean
        message:
          type: string
    ReadinessIssue:
      type: object
      required: [code, capabilities, message]
      properties:
        code:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [query, index]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        recommendedAction:
          type: string
    ReadinessCheck:
      type: object
      required: [code, name, status, blocking, capabilities, message]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, warn, skip]
        blocking:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [query, index]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    DistanceMetric:
      type: string
      enum: [l2, cosine, ip]
    CollectionStatus:
      type: string
      enum: [creating, indexing, ready, failed, archived]
    IndexJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    PhysicalCollectionStatus:
      type: string
      enum: [building, failed_build, active, retired, delete_pending, deleted, cleanup_failed]
    CollectionIndexSnapshot:
      type: object
      required: [sourcePath, ozelgeDataPath, distanceMetric, chunkSize, chunkOverlap, embeddingModel]
      properties:
        sourcePath:
          type: string
        ozelgeDataPath:
          type: string
        distanceMetric:
          $ref: "#/components/schemas/DistanceMetric"
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        embeddingModel:
          type: string
    CollectionIndexState:
      type: object
      required: [status, reindexRequired, activeSnapshot, desiredSnapshot, changedFields, note]
      properties:
        status:
          type: string
          enum: [no_active_index, synced, reindex_required]
        reindexRequired:
          type: boolean
        activeSnapshot:
          oneOf:
            - $ref: "#/components/schemas/CollectionIndexSnapshot"
            - type: "null"
        desiredSnapshot:
          $ref: "#/components/schemas/CollectionIndexSnapshot"
        changedFields:
          type: array
          items:
            type: string
        note:
          type: string
    PublicCollection:
      type: object
      required:
        - id
        - displayName
        - description
        - status
        - chunkCount
        - activeVersion
        - updatedAt
        - indexState
        - readyUrl
        - queryUrl
        - retrieveUrl
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/CollectionStatus"
        chunkCount:
          type: [integer, "null"]
        activeVersion:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
        indexState:
          oneOf:
            - $ref: "#/components/schemas/CollectionIndexState"
            - type: "null"
        readyUrl:
          type: string
        queryUrl:
          type: string
        retrieveUrl:
          type: string
    PublicCollectionListResponse:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/PublicCollection"
    PublicCollectionDetailResponse:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: "#/components/schemas/PublicCollection"
    CollectionReadinessIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
    CollectionReadinessModelAvailability:
      type: object
      required: [embeddingModel, embeddingModelAvailable, chatModel, chatModelAvailable]
      properties:
        embeddingModel:
          type: string
          description: Model currently used by live retrieval and query reads.
        embeddingModelAvailable:
          type: boolean
        chatModel:
          type: string
        chatModelAvailable:
          type: boolean
        desiredEmbeddingModel:
          type: string
          description: >
            Future embedding model from saved admin configuration. Present when a
            reindex is still needed before live reads switch models.
    CollectionReadinessCapabilities:
      type: object
      required: [query, retrieve, reindex]
      properties:
        query:
          type: boolean
        retrieve:
          type: boolean
        reindex:
          type: boolean
    CollectionReadinessPayload:
      type: object
      description: >
        Collection-specific readiness. This endpoint can return 200 even when
        query and retrieve are blocked; consult capabilities, blockers, and warnings.
      required:
        - id
        - status
        - hasActivePhysicalCollection
        - activeVersion
        - activeJob
        - chromaReadable
        - chromaCount
        - modelAvailability
        - capabilities
        - blockers
        - warnings
        - recommendedActions
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/CollectionStatus"
        hasActivePhysicalCollection:
          type: boolean
        activeVersion:
          type: [string, "null"]
        activeJob:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id:
                  type: string
                status:
                  $ref: "#/components/schemas/IndexJobStatus"
            - type: "null"
        chromaReadable:
          type: boolean
        chromaCount:
          type: integer
        modelAvailability:
          $ref: "#/components/schemas/CollectionReadinessModelAvailability"
        capabilities:
          $ref: "#/components/schemas/CollectionReadinessCapabilities"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CollectionReadinessIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CollectionReadinessIssue"
        recommendedActions:
          type: array
          items:
            type: string
    RagSource:
      type: object
      required: [content]
      properties:
        documentId:
          type: string
        sourcePath:
          type: string
        sourceType:
          type: string
        chunkIndex:
          type: integer
        ozelgeId:
          type: string
        sayi:
          oneOf:
            - type: integer
            - type: string
        tarih:
          type: string
        konu:
          type: string
        distanceScore:
          type: number
        content:
          type: string
    RetrievalDebug:
      type: object
      required: [latency]
      properties:
        latency:
          type: object
          required: [retrievalMs, totalMs]
          properties:
            retrievalMs:
              type: integer
            totalMs:
              type: integer
    QueryDebug:
      type: object
      required: [latency]
      properties:
        latency:
          type: object
          required: [retrievalMs, generationMs, totalMs]
          properties:
            retrievalMs:
              type: integer
            generationMs:
              type: integer
            totalMs:
              type: integer
    RetrieveRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
        k:
          type: integer
          minimum: 1
    RetrieveResponse:
      type: object
      required:
        - question
        - k
        - sourceCount
        - distanceScoreThreshold
        - sources
        - collectionId
        - collectionDisplayName
        - activeVersion
        - embeddingModel
      properties:
        question:
          type: string
        k:
          type: integer
        sourceCount:
          type: integer
        distanceScoreThreshold:
          type: number
        sources:
          type: array
          description: Threshold-filtered retrieval results for evidence browsing.
          items:
            $ref: "#/components/schemas/RagSource"
        collectionId:
          type: string
        collectionDisplayName:
          type: string
        activeVersion:
