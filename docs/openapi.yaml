        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job event timeline
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobEventsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [Admin Jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
components:
  headers:
    XRateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: string
    XRateLimitRemaining:
      description: Remaining allowed requests in the current window.
      schema:
        type: string
    XRateLimitReset:
      description: ISO timestamp when the current rate-limit window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until the client should retry the rate-limited request.
      schema:
        type: string
    CacheControlNoStore:
      description: Returned as no-store for job endpoints.
      schema:
        type: string
  parameters:
    XTenantId:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant scope. Defaults to default when omitted. When admin auth is enabled on /v1/admin routes, the backend derives tenant scope from the authenticated session and ignores this header.
      schema:
        type: string
    XUserId:
      name: x-user-id
      in: header
      required: false
      description: User identity for rate limiting and logs. Defaults to local-dev when omitted. When admin auth is enabled on /v1/admin routes, the backend derives user identity from the authenticated session and ignores this header.
      schema:
        type: string
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Optional request correlation ID. Generated automatically when omitted.
      schema:
        type: string
    XAdminActionToken:
      name: x-admin-action-token
      in: header
      required: false
      description: Required on POST/PATCH/DELETE admin mutations when admin auth is enabled, except login, logout, and validation-only endpoints.
      schema:
        type: string
    ReadyDetails:
      name: details
      in: query
      required: false
      schema:
        type: boolean
      description: Return the full readiness payload when true.
    ReadyStrict:
      name: strict
      in: query
      required: false
      schema:
        type: boolean
      description: Return HTTP 503 when the system is not ready.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    JobCollectionId:
      name: collectionId
      in: query
      required: false
      schema:
        type: string
    JobStatus:
      name: status
      in: query
      required: false
      description: >
        Job status filter. The implementation accepts repeated params and comma-separated values.
      schema:
        oneOf:
          - type: string
            enum: [queued, running, succeeded, failed, cancelled]
          - type: array
            items:
              type: string
              enum: [queued, running, succeeded, failed, cancelled]
      style: form
      explode: true
    JobLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    JobCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    ApiError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NoContent:
      description: No content
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: rag_admin_session
  schemas:
    ApiErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - INVALID_REQUEST_BODY
            - COLLECTION_FORBIDDEN
            - COLLECTION_NOT_FOUND
            - COLLECTION_NOT_READY
            - COLLECTION_INDEX_ALREADY_RUNNING
            - NO_RELEVANT_CONTEXT
            - ANSWER_NOT_IN_RETRIEVED_CONTEXT
            - DISALLOWED_FALLBACK_ANSWER
            - COLLECTION_INDEXING
            - COLLECTION_STORAGE_INCONSISTENT
            - MODEL_BACKPRESSURE
            - INVALID_JOB_STATUS
            - UNAVAILABLE_MODEL
            - EMBEDDING_PROVIDER_NOT_CONFIGURED
            - EMBEDDING_PROVIDER_UNREACHABLE
            - EMBEDDING_PROVIDER_ERROR
            - EMBEDDING_DIMENSION_MISMATCH
            - RATE_LIMIT_EXCEEDED
            - UNAUTHORIZED
            - FORBIDDEN
            - EMPTY_MODEL_RESPONSE
            - CHAT_NOT_CONFIGURED
            - CHAT_PROVIDER_UNREACHABLE
            - CHAT_PROVIDER_ERROR
            - ROUTE_NOT_FOUND
            - COLLECTION_FILES_READ_ONLY
            - FILE_TOO_LARGE
            - TOO_MANY_FILES
            - UNSUPPORTED_FILE
            - DOCUMENT_NOT_FOUND
            - EMBEDDING_SERVICE_NOT_FOUND
            - EMBEDDING_SERVICE_IN_USE
            - EMBEDDING_SERVICE_READ_ONLY
            - CHAT_SERVICE_NOT_FOUND
            - CHAT_SERVICE_IN_USE
            - CHAT_SERVICE_READ_ONLY
            - CHAT_MODEL_MISSING
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    AdminCapabilities:
      type: array
      description: What the session may do (every capability when admin auth is disabled). For display; the server checks each request.
      items:
        type: string
        enum: [read, createCollection, validateCollection, updateCollection, reindexCollection, cancelJob, deleteCollection, deleteJob, bulkDeleteJobs, manageDocuments, manageEmbeddingServices, manageChatServices]
    AdminServerInfoResponse:
      type: object
      required: [version, uploads, jobStatuses, embeddingProviders, distanceMetrics, servicePresets]
      properties:
        version:
          type: string
        uploads:
          type: object
          required: [extensions, maxFileSizeBytes, maxFilesPerRequest]
          properties:
            extensions:
              type: array
              items:
                type: string
            maxFileSizeBytes:
              type: integer
            maxFilesPerRequest:
              type: integer
        jobStatuses:
          type: array
          items:
            type: string
        embeddingProviders:
          type: array
          items:
            type: string
        distanceMetrics:
          type: array
          items:
            type: string
        servicePresets:
          type: array
          items:
            type: object
            required: [id, label, name, baseUrl, apiKeyRequired, kinds]
            properties:
              id:
                type: string
              label:
                type: string
              name:
                type: string
              baseUrl:
                type: string
              apiKeyRequired:
                type: boolean
              kinds:
                type: array
                items:
                  type: string
                  enum: [embedding, chat]
    RootResponse:
      type: object
      required: [name, version, status, message, endpoints]
      properties:
        name:
          type: string
        version:
          type: string
          description: Running RAGStation version (package.json).
        status:
          type: string
          const: ok
        message:
          type: string
        endpoints:
          type: object
          required: [health, ready, adminCollections, collections, query, retrieve, testFrontend]
          properties:
            health:
              type: string
            ready:
              type: string
            adminCollections:
              type: string
            collections:
              type: string
            query:
              type: string
            retrieve:
              type: string
            testFrontend:
              type: string
    HealthResponse:
      type: object
      required: [status, alive, version, port, uptimeSec, timestamp]
      properties:
        status:
          type: string
          const: ok
        alive:
          type: boolean
        version:
          type: string
          description: Running RAGStation version (package.json).
        port:
          type: integer
        uptimeSec:
          type: number
        timestamp:
          type: string
          format: date-time
    ReadinessIssueSummary:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
    ReadySummary:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - retrieveReady
        - queryEnabled
        - queryReady
        - indexReady
        - retrieveSummary
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - blockers
        - warnings
        - dependencies
        - config
        - diagnostics
        - operations
        - operationalAlerts
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
          description: >-
            retrieveReady && indexReady && (!queryEnabled || queryReady). A retrieve-only deployment (no chat LLM)
            can be ready.
        systemReadyFor:
          type: string
          enum: [query-and-index, retrieve-and-index, query, retrieve, index, neither]
        overallSummary:
          type: string
        retrieveReady:
          type: boolean
        queryEnabled:
          type: boolean
          description: True when the optional chat LLM is configured. When false, /query returns 503 CHAT_NOT_CONFIGURED.
        queryReady:
          type: boolean
          description: Always false when no chat LLM is configured.
        indexReady:
          type: boolean
        retrieveSummary:
          type: string
        querySummary:
          type: string
          description: Explains that /query is disabled when no chat LLM is configured.
        indexSummary:
          type: string
        blockerCodes:
          type: array
          items:
            type: string
        warningCodes:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        dependencies:
          type: object
          required: [registry, chroma, embedding, chat]
          properties:
            registry:
              $ref: "#/components/schemas/DependencyAvailability"
            chroma:
              $ref: "#/components/schemas/DependencyAvailability"
            embedding:
              allOf:
                - $ref: "#/components/schemas/DependencyAvailability"
              description: >-
                Configured default embedding for new collections. ok is true for a built-in model that is not
                downloaded yet (it downloads on the first indexing).
            chat:
              type: object
              required: [ok, configured]
              properties:
                ok:
                  type: boolean
                configured:
                  type: boolean
        config:
          type: object
          required: [port, chatModel, embeddingProvider, embeddingModel, chromaUrl]
          properties:
            port:
              type: integer
            chatModel:
              type: [string, "null"]
              description: >-
                The tenant's chat LLM model (x-tenant-id; its choice, else the server's), or null when there is none
                (retrieve-only).
            chatServiceId:
              type: [string, "null"]
              description: The chat service of that model ("server" = .env / config).
            chatSource:
              type: string
              enum: [tenant, server, none]
            embeddingProvider:
              $ref: "#/components/schemas/EmbeddingProvider"
            embeddingModel:
              type: string
              description: Configured default embedding model for new collections.
            chromaUrl:
              type: string
        diagnostics:
          type: object
          required: [full, strictHttpStatus, fullStrict]
          properties:
            full:
              type: string
            strictHttpStatus:
              type: string
            fullStrict:
              type: string
        operations:
          $ref: "#/components/schemas/OperationalSummary"
        operationalAlerts:
          type: array
          items:
            $ref: "#/components/schemas/OperationalAlert"
    ReadyDetailsResponse:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - retrieveReady
        - queryEnabled
        - queryReady
        - indexReady
        - retrieveSummary
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - port
        - chatModel
        - embeddingProvider
        - embeddingModel
        - chromaUrl
        - chromaLatencyMs
        - capabilities
        - blockers
        - warnings
        - checks
        - dependencies
        - dataSource
        - operations
        - operationalAlerts
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
          description: >-
            retrieveReady && indexReady && (!queryEnabled || queryReady). A retrieve-only deployment (no chat LLM)
            can be ready.
        systemReadyFor:
          type: string
          enum: [query-and-index, retrieve-and-index, query, retrieve, index, neither]
        overallSummary:
          type: string
        retrieveReady:
          type: boolean
        queryEnabled:
          type: boolean
          description: True when the optional chat LLM is configured. When false, /query returns 503 CHAT_NOT_CONFIGURED.
        queryReady:
          type: boolean
          description: Always false when no chat LLM is configured.
        indexReady:
          type: boolean
        retrieveSummary:
          type: string
        querySummary:
          type: string
          description: Explains that /query is disabled when no chat LLM is configured.
        indexSummary:
          type: string
        blockerCodes:
          type: array
          items:
            type: string
        warningCodes:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        port:
          type: integer
        chatModel:
          type: [string, "null"]
          description: The tenant's chat LLM model (x-tenant-id), or null when there is none (retrieve-only).
        chatServiceId:
          type: [string, "null"]
        chatSource:
          type: string
          enum: [tenant, server, none]
        embeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        embeddingModel:
          type: string
          description: Configured default embedding model for new collections.
        chromaUrl:
          type: string
        chromaLatencyMs:
          type: integer
        capabilities:
          type: object
          required: [retrieve, query, index]
          properties:
            retrieve:
              $ref: "#/components/schemas/SystemCapabilityState"
            query:
              allOf:
                - $ref: "#/components/schemas/SystemCapabilityState"
                - type: object
                  required: [enabled]
                  properties:
                    enabled:
                      type: boolean
                      description: False when no chat LLM is configured (/query disabled).
            index:
              $ref: "#/components/schemas/SystemCapabilityState"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssue"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessCheck"
        dependencies:
          type: object
          required: [chroma, registry, embedding, chat]
          properties:
            chroma:
              type: object
              additionalProperties: true
            registry:
              type: object
              additionalProperties: true
            embedding:
              $ref: "#/components/schemas/EmbeddingTargetStatus"
            chat:
              $ref: "#/components/schemas/ChatProviderStatus"
        dataSource:
          type: object
          additionalProperties: true
        operations:
          $ref: "#/components/schemas/OperationalSummary"
        operationalAlerts:
          type: array
          items:
            $ref: "#/components/schemas/OperationalAlert"
    OperationalSummary:
      type: object
      required: [observedAt, collections, jobs, physicalCollections, runtime]
      properties:
        observedAt:
          type: string
          format: date-time
        collections:
          $ref: "#/components/schemas/OperationalCollectionSummary"
        jobs:
          $ref: "#/components/schemas/OperationalJobSummary"
        physicalCollections:
          $ref: "#/components/schemas/OperationalPhysicalCollectionSummary"
        runtime:
          $ref: "#/components/schemas/OperationalRuntimeSummary"
    OperationalCollectionSummary:
      type: object
      required: [total, creating, indexing, ready, failed, archived]
      properties:
        total:
          type: integer
        creating:
          type: integer
        indexing:
          type: integer
        ready:
          type: integer
        failed:
          type: integer
        archived:
          type: integer
    OperationalJobSummary:
      type: object
      required:
        - total
        - active
        - queued
        - running
        - terminal
        - succeeded
        - failed
        - cancelled
        - oldestActiveUpdatedAt
        - oldestActiveAgeSec
        - newestFailureAt
      properties:
        total:
          type: integer
        active:
          type: integer
        queued:
          type: integer
        running:
          type: integer
        terminal:
          type: integer
        succeeded:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        oldestActiveUpdatedAt:
          type: [string, "null"]
          format: date-time
        oldestActiveAgeSec:
          type: [integer, "null"]
        newestFailureAt:
          type: [string, "null"]
          format: date-time
    OperationalPhysicalCollectionSummary:
      type: object
      required:
        - total
        - building
        - active
        - failedBuild
        - deletePending
        - cleanupFailed
        - deleted
        - cleanupBacklog
        - oldestDueDeleteAt
      properties:
        total:
          type: integer
        building:
          type: integer
        active:
          type: integer
        failedBuild:
          type: integer
        deletePending:
          type: integer
        cleanupFailed:
          type: integer
        deleted:
          type: integer
        cleanupBacklog:
          type: integer
        oldestDueDeleteAt:
          type: [string, "null"]
          format: date-time
    OperationalRuntimeSummary:
      type: object
      required: [rateLimit, concurrency, timeouts]
      properties:
        rateLimit:
          type: object
          required: [enabled, windowMs, maxRequestsPerWindow]
          properties:
            enabled:
              type: boolean
            windowMs:
              type: integer
            maxRequestsPerWindow:
              type: integer
        concurrency:
          type: object
          required: [maxConcurrentEmbeddings, maxConcurrentGenerations]
          properties:
            maxConcurrentEmbeddings:
              type: integer
            maxConcurrentGenerations:
              type: integer
        timeouts:
          type: object
          required: [readinessMs, ragMs]
          properties:
            readinessMs:
              type: integer
            ragMs:
              type: integer
    OperationalAlert:
      type: object
      required: [code, severity, message]
      properties:
        code:
          type: string
          enum:
            - FAILED_COLLECTIONS_PRESENT
            - FAILED_JOBS_PRESENT
            - CLEANUP_BACKLOG_PRESENT
            - CLEANUP_RETRY_REQUIRED
        severity:
          type: string
          enum: [warn, info]
        message:
          type: string
        recommendedAction:
          type: string
    DependencyAvailability:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
    ChatProviderStatus:
      type: object
      description: >-
        Result of the free, cached (30 s) GET {chat.baseUrl}/models check of the optional chat LLM. It never runs
        a generation and never contains the API key. Readiness check codes derived from it (capability query):
        CHAT_NOT_CONFIGURED (skip, non-blocking), CHAT_PROVIDER_UNREACHABLE, CHAT_PROVIDER_AUTH_FAILED and
        CHAT_MODEL_MISSING (fail, block query only), CHAT_MODEL_UNVERIFIED (warn, the provider has no model
        listing), CHAT_MODEL_AVAILABLE (pass).
      required: [configured, baseUrl, model, reachable, authOk, modelListed, ok, latencyMs]
      properties:
        configured:
          type: boolean
        baseUrl:
          type: [string, "null"]
        model:
          type: [string, "null"]
        reachable:
          type: boolean
        authOk:
          type: boolean
        modelListed:
          description: The string "unknown" when the provider has no usable GET /models listing.
          oneOf:
            - type: boolean
            - type: string
              const: unknown
        ok:
          type: boolean
        latencyMs:
          type: integer
        httpStatus:
          type: integer
        availableModels:
          type: array
          items:
            type: string
        error:
          type: string
    EmbeddingProvider:
      type: string
      enum: [builtin, openai-compatible]
      description: >-
        builtin = an ONNX model from the fixed built-in catalog running inside the backend process (CPU), downloaded
        once on first use into embedding.cacheDir. openai-compatible = any OpenAI-compatible /v1/embeddings API
        reached through an embedding service: one managed with /v1/admin/embedding-services, or the read-only
        "server" service from embedding.baseUrl / RAG_EMBEDDING_BASE_URL. API keys are never returned.
    EmbeddingTargetStatus:
      type: object
      description: >-
        Cheap availability check of one embedding provider/model; it never downloads a model and never runs an
        embedding. builtin = catalog + cache check; openai-compatible = free, cached (30 s) GET
        {embedding.baseUrl}/models. Never contains the API key. Readiness check codes derived from it (capabilities
        retrieve, query, index): EMBEDDING_MODEL_READY (pass), EMBEDDING_MODEL_NOT_DOWNLOADED (warn, non-blocking:
        downloads on the first indexing), EMBEDDING_MODEL_UNVERIFIED (warn, the service has no model listing),
        EMBEDDING_MODEL_UNSUPPORTED, EMBEDDING_PROVIDER_NOT_CONFIGURED, EMBEDDING_PROVIDER_UNREACHABLE,
        EMBEDDING_PROVIDER_AUTH_FAILED and EMBEDDING_MODEL_MISSING (fail, blocking).
      required: [provider, model, configured, supported, ok, latencyMs]
      properties:
        provider:
          $ref: "#/components/schemas/EmbeddingProvider"
        model:
          type: string
        configured:
          type: boolean
          description: Always true for builtin; for openai-compatible, whether embedding.baseUrl is set.
        supported:
          type: boolean
          description: For builtin, whether the model is in the built-in catalog; always true for openai-compatible.
        downloaded:
          type: boolean
          description: builtin only. Whether the model files are already in embedding.cacheDir.
        approxDownloadMb:
          type: integer
          description: builtin only. Approximate one-time download size.
        reachable:
          type: boolean
          description: openai-compatible only.
        authOk:
          type: boolean
          description: openai-compatible only.
        modelListed:
          description: openai-compatible only. The string "unknown" when the service has no usable GET /models listing.
          oneOf:
            - type: boolean
            - type: string
              const: unknown
        availableModels:
          type: array
          items:
            type: string
        httpStatus:
          type: integer
        ok:
          type: boolean
          description: Usable now. A built-in model that is not downloaded yet is still ok (it downloads on first use).
        latencyMs:
          type: integer
        error:
          type: string
    SystemCapabilityState:
      type: object
      required: [ready, message]
      properties:
        ready:
          type: boolean
        message:
          type: string
    ReadinessIssue:
      type: object
      required: [code, capabilities, message]
      properties:
        code:
          type: string
        capabilities:
          type: array
          items:
            type: string
            enum: [retrieve, query, index]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        recommendedAction:
          type: string
    ReadinessCheck:
      type: object
      required: [code, name, status, blocking, capabilities, message]
      properties:
        code:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, warn, skip]
        blocking:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
            enum: [retrieve, query, index]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    DistanceMetric:
      type: string
      enum: [l2, cosine, ip]
    CollectionStatus:
      type: string
      enum: [creating, indexing, ready, failed, archived]
    IndexJobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    PhysicalCollectionStatus:
      type: string
      enum: [building, failed_build, active, retired, delete_pending, deleted, cleanup_failed]
    CollectionIndexSnapshot:
      type: object
      required: [sourcePath, distanceMetric, chunkSize, chunkOverlap, embeddingProvider, embeddingModel]
      properties:
        sourcePath:
          type: string
        distanceMetric:
          $ref: "#/components/schemas/DistanceMetric"
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        embeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        embeddingModel:
          type: string
    CollectionIndexState:
      type: object
      required: [status, reindexRequired, activeSnapshot, desiredSnapshot, changedFields, note]
      properties:
        status:
          type: string
          enum: [no_active_index, synced, reindex_required]
        reindexRequired:
          type: boolean
        activeSnapshot:
          oneOf:
            - $ref: "#/components/schemas/CollectionIndexSnapshot"
            - type: "null"
        desiredSnapshot:
          $ref: "#/components/schemas/CollectionIndexSnapshot"
        changedFields:
          type: array
          items:
            type: string
        documentsChanged:
          type: boolean
          description: Documents were uploaded (added or replaced) through the files API since the last successful reindex. Deletes are applied to the index at once and do not set it.
        note:
          type: string
    PublicCollection:
      type: object
      required:
        - id
        - displayName
        - description
        - status
        - indexedFileCount
        - chunkCount
        - activeVersion
        - updatedAt
        - indexState
        - readyUrl
        - queryUrl
        - retrieveUrl
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: [string, "null"]
        status:
          $ref: "#/components/schemas/CollectionStatus"
        indexedFileCount:
          type: [integer, "null"]
          description: Number of files whose content is searchable; null before the first index or for indexes built before this field existed.
        chunkCount:
          type: [integer, "null"]
        activeVersion:
          type: [string, "null"]
        updatedAt:
          type: string
          format: date-time
        indexState:
          oneOf:
            - $ref: "#/components/schemas/CollectionIndexState"
            - type: "null"
        readyUrl:
          type: string
        queryUrl:
          type: string
        retrieveUrl:
          type: string
    PublicCollectionListResponse:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/PublicCollection"
    PublicCollectionDetailResponse:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: "#/components/schemas/PublicCollection"
    CollectionReadinessIssue:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
    CollectionReadinessModelAvailability:
      type: object
      required: [embeddingProvider, embeddingModel, embeddingModelAvailable, chatModel, chatModelAvailable]
      properties:
        embeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        embeddingModel:
          type: string
          description: >-
            Model currently used by live retrieval and query reads (with embeddingProvider: the pair the active
            index was built with).
        embeddingServiceId:
          type: string
          description: openai-compatible only; the embedding service the active index was built with.
        desiredEmbeddingServiceId:
          type: string
          description: Set with desiredEmbeddingProvider/Model when the saved embedding service differs from the active one.
        embeddingModelAvailable:
          type: boolean
          description: >-
            Result of the cheap embedding check of the active pair (never embeds). A built-in model that is not
            downloaded yet still counts as available (EMBEDDING_MODEL_NOT_DOWNLOADED warning).
        chatModel:
          type: [string, "null"]
          description: >-
            The tenant's chat LLM model (its choice, else the server's; not per collection), or null when there is
            none (retrieve-only).
        chatServiceId:
          type: [string, "null"]
          description: The chat service of that model ("server" = .env / config).
        chatModelAvailable:
          type: boolean
          description: Result of the chat service check (GET {baseUrl}/models); only affects query.
        desiredEmbeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        desiredEmbeddingModel:
          type: string
          description: >
            Future embedding provider/model from saved admin configuration. desiredEmbeddingProvider and
            desiredEmbeddingModel are present together when the saved pair differs from the active one, i.e.
            a reindex is still needed before live reads switch embeddings.
    CollectionReadinessCapabilities:
      type: object
      required: [query, retrieve, reindex]
      properties:
        query:
          type: boolean
          description: retrieve && a chat LLM is configured && the chat provider check is ok.
        retrieve:
          type: boolean
        reindex:
          type: boolean
    CollectionReadinessPayload:
      type: object
      description: >
        Collection-specific readiness. This endpoint can return 200 even when
        query and retrieve are blocked; consult capabilities, blockers, and warnings.
        Chat LLM codes: CHAT_NOT_CONFIGURED and CHAT_MODEL_UNVERIFIED appear in warnings;
        CHAT_PROVIDER_UNREACHABLE, CHAT_PROVIDER_AUTH_FAILED and CHAT_MODEL_MISSING appear in
        blockers and only affect query.
        Embedding codes (checked for the collection's active embedding provider/model):
        EMBEDDING_MODEL_UNSUPPORTED, EMBEDDING_PROVIDER_NOT_CONFIGURED, EMBEDDING_PROVIDER_UNREACHABLE,
        EMBEDDING_PROVIDER_AUTH_FAILED and EMBEDDING_MODEL_MISSING appear in blockers and block retrieve and
        query; EMBEDDING_MODEL_NOT_DOWNLOADED and EMBEDDING_MODEL_UNVERIFIED appear in warnings.
      required:
        - id
        - status
        - hasActivePhysicalCollection
        - activeVersion
        - activeJob
        - chromaReadable
        - chromaCount
        - modelAvailability
        - capabilities
        - blockers
        - warnings
        - recommendedActions
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/CollectionStatus"
        hasActivePhysicalCollection:
          type: boolean
        activeVersion:
          type: [string, "null"]
        activeJob:
          oneOf:
            - type: object
              required: [id, status]
              properties:
                id:
                  type: string
                status:
                  $ref: "#/components/schemas/IndexJobStatus"
            - type: "null"
        chromaReadable:
          type: boolean
        chromaCount:
          type: integer
        modelAvailability:
          $ref: "#/components/schemas/CollectionReadinessModelAvailability"
        capabilities:
          $ref: "#/components/schemas/CollectionReadinessCapabilities"
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/CollectionReadinessIssue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CollectionReadinessIssue"
        recommendedActions:
          type: array
          items:
            type: string
    RagSource:
      type: object
      required: [content]
      properties:
        documentId:
          type: string
        sourcePath:
          type: string
        sourceType:
          type: string
        chunkIndex:
          type: integer
        distanceScore:
          type: number
        content:
          type: string
    RetrievalDebug:
      type: object
      required: [latency]
      properties:
        latency:
          type: object
          required: [retrievalMs, totalMs]
          properties:
            retrievalMs:
              type: integer
            totalMs:
              type: integer
    QueryDebug:
      type: object
      required: [latency]
      properties:
        latency:
          type: object
          required: [retrievalMs, generationMs, totalMs]
          properties:
            retrievalMs:
              type: integer
            generationMs:
              type: integer
            totalMs:
              type: integer
    RetrieveRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
        k:
          type: integer
          minimum: 1
    RetrieveResponse:
      type: object
      required:
        - question
        - k
        - sourceCount
        - distanceScoreThreshold
        - sources
        - collectionId
        - collectionDisplayName
        - activeVersion
        - embeddingProvider
        - embeddingModel
      properties:
        question:
          type: string
        k:
          type: integer
        sourceCount:
          type: integer
        distanceScoreThreshold:
          type: number
        sources:
          type: array
          description: Threshold-filtered retrieval results for evidence browsing.
          items:
            $ref: "#/components/schemas/RagSource"
        collectionId:
          type: string
        collectionDisplayName:
          type: string
        activeVersion:
          type: [string, "null"]
        embeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        embeddingModel:
          type: string
          description: >-
            Embedding model used for retrieval (with embeddingProvider: the pair the collection's active index was
            built with, never the configured default).
        embeddingServiceId:
          type: string
          description: openai-compatible only; the embedding service used for the query embedding.
        debug:
          $ref: "#/components/schemas/RetrievalDebug"
    QueryRequest:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 1
    QueryResponse:
      type: object
      required:
        - answer
        - embeddingProvider
        - embeddingModel
        - chatModel
        - distanceScoreThreshold
        - sources
        - collectionId
        - collectionDisplayName
        - activeVersion
      properties:
        answer:
          type: string
        embeddingProvider:
          $ref: "#/components/schemas/EmbeddingProvider"
        embeddingModel:
          type: string
          description: Embedding model (collection's active pair, with embeddingProvider) used to retrieve the sources that grounded the answer.
        embeddingServiceId:
          type: string
          description: openai-compatible only; the embedding service ("server" = the one from .env / config).
        chatModel:
          type: string
          description: Chat LLM model that generated the answer (the tenant's choice, else the server's).
        chatServiceId:
          type: string
          description: The chat service that generated the answer ("server" = .env / config).
        distanceScoreThreshold:
          type: number
        sources:
          type: array
          description: >
            Sources actually passed into generation. This may be a subset of the
            broader retrieval result set due to context-budget trimming.
          items:
            $ref: "#/components/schemas/RagSource"
        collectionId:
          type: string
        collectionDisplayName:
          type: string
        activeVersion:
          type: [string, "null"]
        debug:
          $ref: "#/components/schemas/QueryDebug"
    CreateCollectionRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      description: >-
        Collections have no chat model; unknown fields such as chatModel are rejected with 400 INVALID_REQUEST_BODY.
      properties:
        displayName:
          type: string
          minLength: 1
        description:
          type: string
        sourcePath:
          type: string
          minLength: 1
          description: >-
            Omit it to create an uploads collection with its own folder (data/collections/<id>) whose documents are
            managed with the files endpoints. Give it to index a file or folder on the server (a folder collection).
        distanceMetric:
          $ref: "#/components/schemas/DistanceMetric"
        chunkSize:
          type: integer
          minimum: 1
        chunkOverlap:
          type: integer
          minimum: 0
        retrievalK:
          type: integer
          minimum: 1
        retrievalDistanceThreshold:
          type: number
          minimum: 0
        embeddingProvider:
          allOf:
            - $ref: "#/components/schemas/EmbeddingProvider"
          description: >-
            Defaults to the configured default provider (modelDefaults.embeddingProvider). The configured default only
            applies to new collections; the stored provider/model never change when the default changes.
        embeddingServiceId:
          type: string
          minLength: 1
          description: >-
            openai-compatible only: an embedding service id or "server". Omitted: "server" when configured, else the
            tenant's only service. Unknown ids return 404 EMBEDDING_SERVICE_NOT_FOUND; "builtin" returns 400 (use
            embeddingProvider "builtin").
        embeddingModel:
          type: string
          minLength: 1
          description: >-
            Defaults to the configured default model when the provider is the default provider. With a different
            provider and no model, builtin gets its default built-in model and openai-compatible is rejected with
            422 UNAVAILABLE_MODEL (an explicit model is required).
    UpdateCollectionRequest:
      type: object
      additionalProperties: false
      description: >-
        Collections have no chat model; unknown fields such as chatModel are rejected with 400 INVALID_REQUEST_BODY.
      properties:
        displayName:
          type: string
          minLength: 1
        description:
          type: [string, "null"]
        sourcePath:
          type: string
          minLength: 1
        distanceMetric:
          $ref: "#/components/schemas/DistanceMetric"
        chunkSize:
          type: integer
          minimum: 1
        chunkOverlap:
          type: integer
          minimum: 0
        retrievalK:
          type: integer
          minimum: 1
        retrievalDistanceThreshold:
          type: number
          minimum: 0
        embeddingProvider:
          allOf:
            - $ref: "#/components/schemas/EmbeddingProvider"
          description: Reindex-bound; live reads keep the active embedding until a reindex succeeds.
        embeddingServiceId:
          type: string
          minLength: 1
          description: Reindex-bound; openai-compatible only. An embedding service id or "server".
        embeddingModel:
          type: string
          minLength: 1
          description: Reindex-bound; live reads keep the active embedding until a reindex succeeds.
    CollectionSummary:
