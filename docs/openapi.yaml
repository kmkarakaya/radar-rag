        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        tenantId:
          type: string
        displayName:
          type: string
        description:
          type: string
        status:
          $ref: "#/components/schemas/CollectionStatus"
        activePhysicalCollection:
          type: string
        activeVersion:
          type: string
        sourceKind:
          type: string
          enum: [uploads, folder]
          description: uploads = own folder managed with the files endpoints; folder = a folder on the server (files are read-only).
        sourcePath:
          type: string
        documentsChanged:
          type: boolean
        embeddingProvider:
          allOf:
            - $ref: "#/components/schemas/EmbeddingProvider"
          description: Desired embedding provider, used by the next reindex.
        embeddingModel:
          type: string
          description: Desired embedding model, used by the next reindex.
        embeddingServiceId:
          type: string
          description: Desired embedding service (openai-compatible); unset on older collections, meaning "server".
        activeEmbeddingServiceId:
          type: string
          description: Embedding service the active index was built with.
        distanceMetric:
          $ref: "#/components/schemas/DistanceMetric"
        chromaCollectionConfiguration:
          type: object
          additionalProperties: true
        chunkSize:
          type: integer
        chunkOverlap:
          type: integer
        retrievalK:
          type: integer
        retrievalDistanceThreshold:
          type: number
        activeEmbeddingProvider:
          allOf:
            - $ref: "#/components/schemas/EmbeddingProvider"
          description: Embedding provider the active index was built with; reads use it. Absent before the first successful reindex.
        activeEmbeddingModel:
          type: string
          description: Embedding model the active index was built with; reads use it. Absent before the first successful reindex.
        indexedFileCount:
          type: integer
          description: Number of files whose content is in the active index (unsupported and unreadable files are not counted). Lowered by one when an indexed document is deleted. Absent for indexes built before this field existed; filled by the next reindex.
        documentCount:
          type: integer
          description: Number of loaded document parts in the active index (a PDF gives one per page); not the number of files, see indexedFileCount.
        chunkCount:
          type: integer
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastIndexedAt:
          type: string
          format: date-time
        indexState:
          $ref: "#/components/schemas/CollectionIndexState"
    PhysicalCollectionRecord:
      type: object
      required:
        - name
        - tenantId
        - collectionId
        - version
        - status
        - chromaConfiguration
        - createdAt
      properties:
        name:
          type: string
        tenantId:
          type: string
        collectionId:
          type: string
        version:
          type: string
        status:
          $ref: "#/components/schemas/PhysicalCollectionStatus"
        chromaConfiguration:
          type: object
          additionalProperties: true
        indexedFileCount:
          type: integer
          description: Number of files whose content is in this index version. Absent for versions built before this field existed.
        documentCount:
          type: integer
          description: Number of loaded document parts (a PDF gives one per page); not the number of files.
        chunkCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        retiredAt:
          type: string
          format: date-time
        deleteAfter:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
        cleanupError:
          type: string
    AdminCollectionResponse:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: "#/components/schemas/RagCollection"
    AdminPhysicalCollectionsResponse:
      type: object
      required: [collectionId, physicalCollections]
      properties:
        collectionId:
          type: string
        physicalCollections:
          type: array
          items:
            $ref: "#/components/schemas/PhysicalCollectionRecord"
    AdminConfigDefaultsResponse:
      type: object
      required: [collectionDefaults, modelDefaults, chat]
      properties:
        collectionDefaults:
          type: object
          required: [sourcePath, distanceMetric, chunkSize, chunkOverlap, retrievalK, retrievalDistanceThreshold]
          properties:
            sourcePath:
              type: string
            distanceMetric:
              $ref: "#/components/schemas/DistanceMetric"
            chunkSize:
              type: integer
            chunkOverlap:
              type: integer
            retrievalK:
              type: integer
            retrievalDistanceThreshold:
              type: number
        modelDefaults:
          type: object
          description: >-
            Configured default embedding (embedding.provider / embedding.model) for NEW collections. Existing
            collections keep their own stored provider and model.
          required: [embeddingProvider, embeddingModel]
          properties:
            embeddingProvider:
              $ref: "#/components/schemas/EmbeddingProvider"
            embeddingModel:
              type: string
            embeddingServerConfigured:
              type: boolean
              description: Whether the "server" embedding service (RAG_EMBEDDING_BASE_URL / embedding.baseUrl) is set.
        chat:
          type: object
          description: >-
            The server chat LLM from .env / config (npm run onboard or RAG_CHAT_BASE_URL / RAG_CHAT_MODEL). It
            answers /query for tenants without a choice of their own (GET /v1/admin/chat-settings). The API key
            is never returned.
          required: [enabled, baseUrl, model, apiKeyConfigured]
          properties:
            enabled:
              type: boolean
              description: False means no server chat LLM is configured.
            baseUrl:
              type: [string, "null"]
              description: OpenAI-compatible base URL, e.g. http://localhost:11434/v1.
            model:
              type: [string, "null"]
            apiKeyConfigured:
              type: boolean
              description: Whether an API key is set (RAG_CHAT_API_KEY or .local/rag_chat_api_key.secret).
