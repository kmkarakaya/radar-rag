openapi: 3.1.0
info:
  title: Vanilla RAG Backend API
  version: 0.1.0
  description: >
    Machine-readable contract for the current Vanilla RAG Backend implementation.
    This spec covers the versioned public RAG API, admin API, job API, and the
    system health/readiness endpoints.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: System
  - name: Public RAG
  - name: Admin Collections
  - name: Admin Jobs
paths:
  /:
    get:
      tags: [System]
      operationId: getRoot
      summary: Service introspection
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: System readiness probe
      parameters:
        - $ref: "#/components/parameters/ReadyDetails"
        - $ref: "#/components/parameters/ReadyStrict"
      responses:
        "200":
          description: Readiness summary or details
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadySummary"
                  - $ref: "#/components/schemas/ReadyDetailsResponse"
        "503":
          description: Returned only when strict=true and the system is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyDetailsResponse"
  /v1/rag/collections:
    get:
      tags: [Public RAG]
      operationId: listPublicCollections
      summary: List public collections visible to the current tenant
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Public collection list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionListResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}:
    get:
      tags: [Public RAG]
      operationId: getPublicCollection
      summary: Get one public collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Public collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionDetailResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/ready:
    get:
      tags: [Public RAG]
      operationId: getCollectionReady
      summary: Get collection-specific readiness and capability state
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Collection readiness payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionReadinessPayload"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/retrieve:
    post:
      tags: [Public RAG]
      operationId: retrieveSources
      summary: Retrieve source chunks without answer generation
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieved source chunks
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/query:
    post:
      tags: [Public RAG]
      operationId: queryCollection
      summary: Retrieve context and generate a grounded answer
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Generated answer with sources
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections:
    post:
      tags: [Admin Collections]
      operationId: createCollection
      summary: Create a collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateCollectionResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/validate:
    post:
      tags: [Admin Collections]
      operationId: validateCreateCollection
      summary: Validate a create draft without mutating state
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}:
    get:
      tags: [Admin Collections]
      operationId: getAdminCollection
      summary: Get the full editable collection DTO
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Full collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    patch:
      tags: [Admin Collections]
      operationId: patchCollection
      summary: Update a collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Admin Collections]
      operationId: deleteCollection
      summary: Soft-delete a collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/validate:
    post:
      tags: [Admin Collections]
      operationId: validateUpdateCollection
      summary: Validate an update draft against a persisted collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/reindex:
    post:
      tags: [Admin Collections]
      operationId: reindexCollection
      summary: Start an asynchronous reindex job
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "202":
          description: Reindex accepted
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexAcceptedResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs:
    get:
      tags: [Admin Jobs]
      operationId: listJobs
      summary: List tenant-visible jobs
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobCollectionId"
        - $ref: "#/components/parameters/JobStatus"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobCursor"
      responses:
        "200":
          description: Job list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexJobListResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/bulk-delete:
    post:
      tags: [Admin Jobs]
      operationId: bulkDeleteJobs
      summary: Delete multiple terminal jobs
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteJobsRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}:
    get:
      tags: [Admin Jobs]
      operationId: getJob
      summary: Get one job
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job detail
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleJobResponse"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Admin Jobs]
      operationId: deleteJob
      summary: Delete one terminal job
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [Admin Jobs]
      operationId: cancelJob
      summary: Cancel a queued or running job
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
components:
  headers:
    XRateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema:
        type: string
    XRateLimitRemaining:
      description: Remaining allowed requests in the current window.
      schema:
        type: string
    XRateLimitReset:
      description: ISO timestamp when the current rate-limit window resets.
      schema:
        type: string
        format: date-time
    RetryAfter:
      description: Seconds until the client should retry the rate-limited request.
      schema:
        type: string
    CacheControlNoStore:
      description: Returned as no-store for job endpoints.
      schema:
        type: string
  parameters:
    XTenantId:
      name: x-tenant-id
      in: header
      required: false
      description: Tenant scope. Defaults to default when omitted.
      schema:
        type: string
    XUserId:
      name: x-user-id
      in: header
      required: false
      description: User identity for rate limiting and logs. Defaults to local-dev when omitted.
      schema:
        type: string
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Optional request correlation ID. Generated automatically when omitted.
      schema:
        type: string
    ReadyDetails:
      name: details
      in: query
      required: false
      schema:
        type: boolean
      description: Return the full readiness payload when true.
    ReadyStrict:
      name: strict
      in: query
      required: false
      schema:
        type: boolean
      description: Return HTTP 503 when the system is not ready.
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    JobCollectionId:
      name: collectionId
      in: query
      required: false
      schema:
        type: string
    JobStatus:
      name: status
      in: query
      required: false
      description: >
        Job status filter. The implementation accepts repeated params and comma-separated values.
      schema:
        oneOf:
          - type: string
            enum: [queued, running, succeeded, failed, cancelled]
          - type: array
            items:
              type: string
              enum: [queued, running, succeeded, failed, cancelled]
      style: form
      explode: true
    JobLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
    JobCursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    ApiError:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NoContent:
      description: No content
  schemas:
    ApiErrorResponse:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - INVALID_REQUEST_BODY
            - COLLECTION_FORBIDDEN
            - COLLECTION_NOT_FOUND
            - COLLECTION_NOT_READY
            - COLLECTION_INDEX_ALREADY_RUNNING
            - NO_RELEVANT_CONTEXT
            - ANSWER_NOT_IN_RETRIEVED_CONTEXT
            - DISALLOWED_FALLBACK_ANSWER
            - COLLECTION_INDEXING
            - COLLECTION_STORAGE_INCONSISTENT
            - MODEL_BACKPRESSURE
            - INVALID_JOB_STATUS
            - RATE_LIMIT_EXCEEDED
            - EMPTY_MODEL_RESPONSE
            - ROUTE_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    RootResponse:
      type: object
      required: [name, status, message, endpoints]
      properties:
        name:
          type: string
        status:
          type: string
          const: ok
        message:
          type: string
        endpoints:
          type: object
          required: [health, ready, adminCollections, collections, query, retrieve, testFrontend]
          properties:
            health:
              type: string
            ready:
              type: string
            adminCollections:
              type: string
            collections:
              type: string
            query:
              type: string
            retrieve:
              type: string
            testFrontend:
              type: string
    HealthResponse:
      type: object
      required: [status, alive, port, uptimeSec, timestamp]
      properties:
        status:
          type: string
          const: ok
        alive:
          type: boolean
        port:
          type: integer
        uptimeSec:
          type: number
        timestamp:
          type: string
          format: date-time
    ReadinessIssueSummary:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        recommendedAction:
          type: string
    ReadySummary:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - queryReady
        - indexReady
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - blockers
        - warnings
        - dependencies
        - config
        - diagnostics
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        systemReadyFor:
          type: string
          enum: [query-and-index, query, index, neither]
        overallSummary:
          type: string
        queryReady:
          type: boolean
        indexReady:
          type: boolean
        querySummary:
          type: string
        indexSummary:
          type: string
        blockerCodes:
          type: array
          items:
            type: string
        warningCodes:
          type: array
          items:
            type: string
        recommendedActions:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessIssueSummary"
        dependencies:
          type: object
          required: [registry, chroma, ollama]
          properties:
            registry:
              $ref: "#/components/schemas/DependencyAvailability"
            chroma:
              $ref: "#/components/schemas/DependencyAvailability"
            ollama:
              $ref: "#/components/schemas/DependencyAvailability"
        config:
          type: object
          required: [port, chatModel, embeddingModel, chromaUrl]
          properties:
            port:
              type: integer
            chatModel:
              type: string
            embeddingModel:
              type: string
            chromaUrl:
              type: string
        diagnostics:
          type: object
          required: [full, strictHttpStatus, fullStrict]
          properties:
            full:
              type: string
            strictHttpStatus:
              type: string
            fullStrict:
              type: string
    ReadyDetailsResponse:
      type: object
      required:
        - status
        - ready
        - systemReadyFor
        - overallSummary
        - queryReady
        - indexReady
        - querySummary
        - indexSummary
        - blockerCodes
        - warningCodes
        - recommendedActions
        - port
        - chatModel
        - embeddingModel
        - chromaUrl
        - chromaLatencyMs
        - capabilities
        - blockers
        - warnings
        - checks
        - dependencies
        - dataSource
      properties:
        status:
          type: string
          enum: [ok, degraded]
        ready:
          type: boolean
        systemReadyFor:
          type: string
          enum: [query-and-index, query, index, neither]
        overallSummary:
          type: string
        queryReady:
          type: boolean
        indexReady:
          type: boolean
        querySummary:
          type: string
        indexSummary:
          type: string
        blockerCodes:
          type: array
