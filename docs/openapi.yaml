        apiKey:
          type: string
          minLength: 1
    EmbeddingServiceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        baseUrl:
          type: string
          format: uri
        apiKey:
          type: [string, "null"]
          description: A new key; null removes the stored key; omitted keeps it.
    EmbeddingServiceTestRequest:
      oneOf:
