        warnings:
          type: array
          items:
            $ref: "#/components/schemas/CollectionValidationIssue"
        recommendedActions:
          type: array
          items:
            type: string
        impact:
          $ref: "#/components/schemas/CollectionValidationImpact"
    AdminModelDiscoveryResponse:
      type: object
      description: >-
        Embedding model suggestions per provider for the collection embeddingProvider / embeddingModel fields.
        The chat LLM is not discovered here.
      required: [default, providers]
      properties:
        default:
          type: object
          description: Configured default embedding for new collections.
          required: [provider, model]
          properties:
            provider:
              $ref: "#/components/schemas/EmbeddingProvider"
            model:
              type: string
        providers:
          type: object
          required: [builtin, openai-compatible]
          properties:
            builtin:
              type: object
              required: [models, cacheDir]
              properties:
                models:
                  type: array
                  description: The fixed built-in model catalog.
                  items:
                    type: string
                cacheDir:
                  type: string
                  description: Where built-in models are downloaded on first use (embedding.cacheDir).
            openai-compatible:
              type: object
              required: [configured, baseUrl, reachable, models]
              properties:
                configured:
                  type: boolean
                  description: Whether embedding.baseUrl is set.
                baseUrl:
                  type: [string, "null"]
                  description: OpenAI-compatible base URL, e.g. http://localhost:11434/v1; null when not configured.
                reachable:
                  type: boolean
                  description: Whether GET {baseUrl}/models succeeded with the configured API key.
                models:
                  type: array
                  description: >-
                    Models listed by the service's GET /models (all models it offers, not only embedding models);
