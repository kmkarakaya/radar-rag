openapi: 3.1.0
info:
  title: RAGStation API
  version: 0.1.0
  description: >
    Machine-readable contract for the current RAGStation implementation.
    This spec covers the versioned public RAG API, admin API, job API, and the
    system health/readiness endpoints. Admin auth is opt-in and uses a signed
    session cookie plus short-lived action tokens for protected mutations.
    Answer generation (/query) is optional: it needs a single global chat LLM reached through any
    OpenAI-compatible chat completions API. Without one the backend is retrieve-only (retrieve and
    indexing work, /query returns 503 CHAT_NOT_CONFIGURED). Embeddings come from one of two
    providers: builtin (default; an ONNX model running inside the backend on CPU, downloaded once on
    first use) or openai-compatible (any OpenAI-compatible /v1/embeddings API such as Ollama, OpenAI,
    LM Studio or vLLM). Each collection stores its own embedding provider and model; the configured
    default only applies to new collections, and reads always use the pair the active index was
    built with.
servers:
  - url: http://localhost:3010
    description: Local development
tags:
  - name: System
  - name: Public RAG
  - name: Admin Auth
  - name: Admin Collections
  - name: Admin Embedding Services
  - name: Admin Chat Services
  - name: Admin Jobs
  - name: Admin Audit
paths:
  /:
    get:
      tags: [System]
      operationId: getRoot
      summary: Service introspection
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootResponse"
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [System]
      operationId: getReady
      summary: System readiness probe
      parameters:
        - $ref: "#/components/parameters/ReadyDetails"
        - $ref: "#/components/parameters/ReadyStrict"
      responses:
        "200":
          description: Readiness summary or details
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ReadySummary"
                  - $ref: "#/components/schemas/ReadyDetailsResponse"
        "503":
          description: Returned only when strict=true and the system is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyDetailsResponse"
  /v1/rag/collections:
    get:
      tags: [Public RAG]
      operationId: listPublicCollections
      summary: List public collections visible to the current tenant
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Public collection list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionListResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}:
    get:
      tags: [Public RAG]
      operationId: getPublicCollection
      summary: Get one public collection
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Public collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCollectionDetailResponse"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/ready:
    get:
      tags: [Public RAG]
      operationId: getCollectionReady
      summary: Get collection-specific readiness and capability state
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Collection readiness payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionReadinessPayload"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/rag/collections/{collectionId}/retrieve:
    post:
      tags: [Public RAG]
      operationId: retrieveSources
      summary: Retrieve source chunks and the effective embedding provider and model
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveRequest"
      responses:
        "200":
          description: Retrieved source chunks and the effective embedding provider and model
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: >-
            EMBEDDING_DIMENSION_MISMATCH. The query embedding has a different vector size than the collection's
            index; details contains expectedDimensions and gotDimensions. Re-index the collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          description: >-
            EMBEDDING_PROVIDER_ERROR. The embedding service returned an HTTP error (for example 401 bad API key,
            404 unknown model, 429, 5xx); details contains upstreamStatus, providerMessage (API key redacted),
            embeddingProvider and embeddingModel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: >-
            EMBEDDING_PROVIDER_NOT_CONFIGURED (the collection uses the openai-compatible provider but
            embedding.baseUrl is not configured), EMBEDDING_PROVIDER_UNREACHABLE (the embedding service cannot be
            reached, or the built-in model cannot be downloaded or loaded), MODEL_BACKPRESSURE (timeout, abort,
            overload or embedding queue timeout), COLLECTION_INDEXING, or COLLECTION_STORAGE_INCONSISTENT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/rag/collections/{collectionId}/query:
    post:
      tags: [Public RAG]
      operationId: queryCollection
      summary: Retrieve context, generate a grounded answer, and return model metadata
      description: >-
        Answer generation is optional. It uses the single global chat LLM (any OpenAI-compatible chat
        completions API, e.g. Ollama /v1, LM Studio, vLLM, OpenAI, OpenRouter). Without a configured chat LLM
        the backend is retrieve-only and this endpoint returns 503 CHAT_NOT_CONFIGURED before validating the
        body or looking up the collection. The answer is grounded only in the retrieved context and written in
        the language of the question.
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Generated answer with sources and effective model metadata
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          description: >-
            EMBEDDING_DIMENSION_MISMATCH. The query embedding has a different vector size than the collection's
            index; details contains expectedDimensions and gotDimensions. Re-index the collection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "502":
          description: >-
            EMPTY_MODEL_RESPONSE, DISALLOWED_FALLBACK_ANSWER, CHAT_PROVIDER_ERROR, or EMBEDDING_PROVIDER_ERROR.
            CHAT_PROVIDER_ERROR means the chat LLM API returned an HTTP error (for example 401 bad API key, 404
            unknown model, 429, 5xx); details contains upstreamStatus, providerMessage (API key redacted),
            chatModel and embeddingModel. EMBEDDING_PROVIDER_ERROR is the same for the embedding service used to
            embed the question (details contains upstreamStatus, providerMessage, embeddingProvider and
            embeddingModel).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: >-
            CHAT_NOT_CONFIGURED (no chat LLM is configured, answer generation is disabled; no Retry-After header),
            CHAT_PROVIDER_UNREACHABLE (the chat LLM API cannot be reached), EMBEDDING_PROVIDER_NOT_CONFIGURED
            (the collection uses the openai-compatible embedding provider but embedding.baseUrl is not configured),
            EMBEDDING_PROVIDER_UNREACHABLE (the embedding service cannot be reached, or the built-in model cannot
            be downloaded or loaded), MODEL_BACKPRESSURE (timeout, abort, overload or generation/embedding queue
            timeout), COLLECTION_INDEXING, or COLLECTION_STORAGE_INCONSISTENT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /v1/admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Create an admin session cookie with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated admin session summary
          headers:
            Set-Cookie:
              description: HttpOnly session cookie scoped to the admin browser session
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [session, capabilities]
                properties:
                  capabilities:
                    $ref: "#/components/schemas/AdminCapabilities"
                  session:
                    type: object
                    required: [username, role, tenantId, expiresAt]
                    properties:
                      username:
                        type: string
                      role:
                        type: string
                        enum: [viewer, operator, admin]
                      tenantId:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /v1/admin/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: adminLogout
      summary: Clear the admin session cookie
      description: >
        Idempotent. Always clears the cookie and returns 204, whether or not a
        valid session is present, so it requires no authentication.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /v1/admin/auth/session:
    get:
      tags: [Admin Auth]
      operationId: adminSession
      summary: Return the current admin session summary
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Current session summary
          content:
            application/json:
              schema:
                type: object
                required: [enabled, authenticated, session, capabilities]
                properties:
                  capabilities:
                    $ref: "#/components/schemas/AdminCapabilities"
                  enabled:
                    type: boolean
                  authenticated:
                    type: boolean
                  session:
                    anyOf:
                      - type: "null"
                      - type: object
                        required: [username, role, tenantId, expiresAt]
                        properties:
                          username:
                            type: string
                          role:
                            type: string
                            enum: [viewer, operator, admin]
                          tenantId:
                            type: string
                          expiresAt:
                            type: string
                            format: date-time
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/auth/action-token:
    post:
      tags: [Admin Auth]
      operationId: adminActionToken
      summary: Mint a short-lived signed token for a mutating admin route
      security:
        - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, path]
              additionalProperties: false
              properties:
                method:
                  type: string
                path:
                  type: string
      responses:
        "200":
          description: Signed action token and expiry timestamp
          content:
            application/json:
              schema:
                type: object
                required: [actionToken, expiresAt]
                properties:
                  actionToken:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections:
    post:
      tags: [Admin Collections]
      operationId: createCollection
      summary: Create a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: Collection created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          description: >-
            UNAVAILABLE_MODEL or EMBEDDING_PROVIDER_NOT_CONFIGURED; nothing is created. The embedding preflight
            never downloads a model or runs an embedding, and the optional chat LLM is not checked.
            UNAVAILABLE_MODEL: no embedding model for the openai-compatible provider, a built-in model outside the
            built-in catalog (details.availableModels is the catalog), or a model the embedding service does not
            offer (details.availableModels from its GET /models); details.recommendedActions explains the fix.
            A built-in model that is not downloaded yet is accepted (it downloads on the first indexing).
            EMBEDDING_PROVIDER_NOT_CONFIGURED: openai-compatible was chosen but embedding.baseUrl is not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: >-
            EMBEDDING_PROVIDER_UNREACHABLE. The openai-compatible embedding service could not be reached or
            rejected the API key (free GET {embedding.baseUrl}/models check); details.embeddingBaseUrl and
            optional details.httpStatus. Nothing is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/validate:
    post:
      tags: [Admin Collections]
      operationId: validateCreateCollection
      summary: Validate a create draft without mutating state
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/config/defaults:
    get:
      tags: [Admin Collections]
      operationId: getAdminConfigDefaults
      summary: Get create-form runtime defaults
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Runtime defaults for the admin create form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigDefaultsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/server-info:
    get:
      tags: [Admin Collections]
      operationId: getAdminServerInfo
      summary: Server facts for building a client UI (version, upload limits, allowed values, service presets)
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Server facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminServerInfoResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/models:
    get:
      tags: [Admin Collections]
      operationId: listAdminModels
      summary: List embedding model suggestions per embedding provider, with soft-fail behavior
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: >-
            Built-in model catalog and the openai-compatible service's model list; for the external service,
            reachable=false with an empty list (and an error string) indicates discovery soft-fail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModelDiscoveryResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}:
    get:
      tags: [Admin Collections]
      operationId: getAdminCollection
      summary: Get the full editable collection DTO
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Full collection detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    patch:
      tags: [Admin Collections]
      operationId: patchCollection
      summary: Update a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCollectionResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    delete:
      tags: [Admin Collections]
      operationId: deleteCollection
      summary: Soft-delete a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/physical-collections:
    get:
      tags: [Admin Collections]
      operationId: listAdminPhysicalCollections
      summary: List physical collection lifecycle records for one logical collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Physical collection lifecycle list
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPhysicalCollectionsResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/validate:
    post:
      tags: [Admin Collections]
      operationId: validateUpdateCollection
      summary: Validate an update draft against a persisted collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCollectionRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionValidationResult"
        "401":
          $ref: "#/components/responses/ApiError"
        "400":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/reindex:
    post:
      tags: [Admin Collections]
      operationId: reindexCollection
      summary: Start an asynchronous reindex job
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      responses:
        "202":
          description: Reindex accepted
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexAcceptedResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          description: >-
            UNAVAILABLE_MODEL or EMBEDDING_PROVIDER_NOT_CONFIGURED for the collection's saved embedding provider and
            model (same preflight as create; never downloads or embeds); no job is started. A built-in model that
            is not downloaded yet is accepted: the job downloads it once before embedding. The optional chat LLM is
            never involved in indexing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "503":
          description: >-
            EMBEDDING_PROVIDER_UNREACHABLE. The openai-compatible embedding service could not be reached or
            rejected the API key; details.embeddingBaseUrl. No job is started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Rate-limited
          headers:
            X-RateLimit-Limit:
              $ref: "#/components/headers/XRateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/XRateLimitRemaining"
            X-RateLimit-Reset:
              $ref: "#/components/headers/XRateLimitReset"
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/files:
    get:
      tags: [Admin Collections]
      operationId: listCollectionFiles
      summary: List the documents of a collection
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Documents of the collection; writable is true for uploads collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionFilesResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
    post:
      tags: [Admin Collections]
      operationId: uploadCollectionFiles
      summary: Upload or replace documents of an uploads collection
      description: >-
        multipart/form-data with one part named files per document (at most 20, each at most uploads.maxFileSizeMb).
        A file with an existing name replaces it. Afterwards indexState.documentsChanged is true until the next
        successful reindex. Refused while a reindex job is queued or running (409 COLLECTION_INDEX_ALREADY_RUNNING)
        and for folder collections (409 COLLECTION_FILES_READ_ONLY).
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Stored documents and the files that were rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionFilesUploadResponse"
        "400":
          description: INVALID_REQUEST_BODY (no files, not multipart), TOO_MANY_FILES, or UNSUPPORTED_FILE (details.rejected)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "413":
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          $ref: "#/components/responses/ApiError"
  /v1/admin/collections/{collectionId}/files/{fileName}:
    delete:
      tags: [Admin Collections]
      operationId: deleteCollectionFile
      summary: Delete one document of an uploads collection
      description: >-
        Removes the document's chunks from the active index first (so it leaves search results at once and no
        reindex is needed), then deletes the file. If Chroma cannot be reached, 503 COLLECTION_STORAGE_INCONSISTENT
        is returned and nothing is deleted.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/XTenantId"
        - $ref: "#/components/parameters/XUserId"
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/XAdminActionToken"
        - name: fileName
          in: path
          required: true
          description: URL-encoded file name
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          description: COLLECTION_NOT_FOUND or DOCUMENT_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          description: COLLECTION_STORAGE_INCONSISTENT (the search index could not be updated; nothing was deleted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
