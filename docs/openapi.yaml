              type: string
        - type: object
          additionalProperties: false
          required: [baseUrl]
          properties:
            baseUrl:
              type: string
              format: uri
            apiKey:
              type: string
    EmbeddingServiceTestResponse:
      allOf:
        - $ref: "#/components/schemas/EmbeddingServiceModels"
