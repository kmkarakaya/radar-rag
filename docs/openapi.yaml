        source:
          type: string
          enum: [server, panel]
          description: server = .env / config (read-only); panel = added via the API.
        readOnly:
          type: boolean
        configured:
          type: boolean
        inUse:
          type: boolean
          description: Answers /query for the tenant now (its choice, or "server" while it has none).
        defaultModel:
          type: [string, "null"]
          description: server entry only; the model from .env / config.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ChatServicesListResponse:
      type: object
      required: [services, warnings]
      properties:
        services:
          type: array
          items:
            $ref: "#/components/schemas/ChatService"
        warnings:
          type: array
          items:
            type: string
    ChatServiceResponse:
      type: object
      required: [service, warnings]
      properties:
        service:
          $ref: "#/components/schemas/ChatService"
        warnings:
          type: array
          items:
            type: string
    ChatSettingsRequest:
      type: object
      additionalProperties: false
      required: [serviceId, model]
      properties:
        serviceId:
          type: string
          description: A chat service id, or "server" (the chat LLM from .env / config).
        model:
          type: string
          minLength: 1
          maxLength: 200
    ChatSettings:
      type: object
      required: [source, serviceId, serviceName, model, queryEnabled, status, updatedAt, updatedBy]
      properties:
        source:
          type: string
          enum: [tenant, server, none]
          description: tenant = a saved choice; server = no choice, .env / config is used; none = retrieve-only.
        serviceId:
          type: [string, "null"]
        serviceName:
          type: [string, "null"]
        model:
          type: [string, "null"]
        queryEnabled:
          type: boolean
        status:
          type: object
          required: [ok, code, message, reachable, authOk, modelListed]
          properties:
            ok:
              type: boolean
            code:
              type: string
              description: >-
                CHAT_MODEL_AVAILABLE, CHAT_MODEL_UNVERIFIED, CHAT_MODEL_MISSING, CHAT_PROVIDER_UNREACHABLE,
                CHAT_PROVIDER_AUTH_FAILED, CHAT_SERVICE_NOT_FOUND or CHAT_NOT_CONFIGURED.
            message:
              type: string
            reachable:
              type: boolean
            authOk:
              type: boolean
            modelListed:
              oneOf:
                - type: boolean
                - type: string
                  enum: [unknown]
            availableModels:
              type: array
              items:
                type: string
        updatedAt:
          type: [string, "null"]
          format: date-time
        updatedBy:
          type: [string, "null"]
    ChatSettingsUpdateResponse:
      type: object
      required: [settings, warnings]
      properties:
        settings:
          $ref: "#/components/schemas/ChatSettings"
        warnings:
          type: array
          items:
            type: string
    CollectionFile:
      type: object
      required: [name, sizeBytes, modifiedAt, supported]
      properties:
        name:
          type: string
          description: File name (folder collections, path relative to the folder with / separators)
        sizeBytes:
          type: integer
        modifiedAt:
          type: string
          format: date-time
        supported:
          type: boolean
          description: Whether the indexer reads this file type
    CollectionFilesResponse:
      type: object
      required: [collectionId, sourceKind, writable, files, fileCount, totalBytes]
      properties:
        collectionId:
          type: string
        sourceKind:
          type: string
          enum: [uploads, folder]
        writable:
          type: boolean
        files:
          type: array
          items:
            $ref: "#/components/schemas/CollectionFile"
        fileCount:
          type: integer
        totalBytes:
          type: integer
        indexState:
          $ref: "#/components/schemas/CollectionIndexState"
    CollectionFilesUploadResponse:
      type: object
      required: [collectionId, uploaded, rejected]
      properties:
        collectionId:
          type: string
        uploaded:
          type: array
          items:
            type: object
            required: [name, sizeBytes, replaced]
            properties:
              name:
                type: string
              sizeBytes:
                type: integer
              replaced:
                type: boolean
        rejected:
          type: array
          items:
            type: object
            required: [name, code, reason]
            properties:
              name:
                type: string
              code:
                type: string
                enum: [UNSUPPORTED_FILE, INVALID_FILE_NAME]
              reason:
                type: string
        indexState:
          $ref: "#/components/schemas/CollectionIndexState"
    ReindexAcceptedResponse:
      type: object
      required: [job]
      properties:
        job:
          type: object
          required: [id, collectionId, status, targetPhysicalCollection]
          properties:
            id:
              type: string
            collectionId:
              type: string
            status:
              $ref: "#/components/schemas/IndexJobStatus"
            targetPhysicalCollection:
              type: string
    IndexJob:
      type: object
      required:
        - id
        - collectionId
        - tenantId
        - status
        - targetPhysicalCollection
        - targetVersion
        - targetEmbeddingProvider
        - targetEmbeddingModel
        - targetChromaConfiguration
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        collectionId:
          type: string
        tenantId:
          type: string
        status:
          $ref: "#/components/schemas/IndexJobStatus"
        targetPhysicalCollection:
          type: string
        targetVersion:
          type: string
        targetEmbeddingProvider:
          allOf:
            - $ref: "#/components/schemas/EmbeddingProvider"
          description: Embedding provider the job builds with; becomes the collection's activeEmbeddingProvider on success.
        targetEmbeddingServiceId:
          type: string
          description: Embedding service the job builds with (openai-compatible).
        targetEmbeddingModel:
          type: string
          description: Embedding model the job builds with; becomes the collection's activeEmbeddingModel on success.
        targetChromaConfiguration:
          type: object
          additionalProperties: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
        indexedFileCount:
          type: integer
          description: Number of files indexed by the job; set when it succeeds.
        documentCount:
          type: integer
          description: Number of loaded document parts (a PDF gives one per page); set when the job succeeds. Not the number of files.
        chunkCount:
          type: integer
        progress:
          allOf:
            - $ref: "#/components/schemas/IndexJobProgress"
          description: Current progress, computed by the server. Present only while the job is queued or running.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IndexJobProgress:
      type: object
      description: Progress of a queued or running job, summarized by the server from the job's events. Clients show it as is.
      required: [step, stepCount, percent, message, indexedFileCount, chunkCount]
      properties:
        step:
          type: [integer, "null"]
          minimum: 1
          description: Current build step (1-based); null before the first step is reported.
        stepCount:
          type: [integer, "null"]
          minimum: 1
          description: Number of build steps; null before the first step is reported.
        percent:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: How far the job is, 0-100; null when not known yet.
        message:
          type: [string, "null"]
          description: The last step the job reported, in plain words; null before the first event.
        indexedFileCount:
          type: [integer, "null"]
          description: Files with indexable content found so far; null until the source has been read.
        chunkCount:
          type: [integer, "null"]
          description: Chunks produced so far; null until chunking has finished.
    IndexJobEventProgress:
      type: object
      required: [phase, phaseCount]
      properties:
        phase:
          type: integer
          minimum: 1
        phaseCount:
          type: integer
          minimum: 1
        itemsCompleted:
          type: integer
          minimum: 0
        itemsTotal:
          type: integer
          minimum: 0
        unit:
          type: string
          enum: [files, documents, chunks]
    IndexJobEvent:
      type: object
      required:
        - id
        - jobId
        - tenantId
        - collectionId
        - sequence
        - status
        - stage
        - code
        - level
        - message
        - createdAt
      properties:
        id:
          type: string
        jobId:
          type: string
        tenantId:
          type: string
        collectionId:
          type: string
        sequence:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/IndexJobStatus"
        stage:
          type: string
          enum: [queued, running, preparing_target, loading_source, chunking, indexing, verifying, succeeded, failed, cancelled]
        code:
          type: string
          enum:
            - JOB_QUEUED
            - JOB_RUNNING
            - TARGET_RECORD_CREATED
            - PHYSICAL_COLLECTION_CREATING
            - SOURCE_ANALYSIS_STARTED
            - SOURCE_ANALYSIS_COMPLETED
            - CHUNKING_STARTED
            - CHUNKING_COMPLETED
            - VECTOR_INDEXING_STARTED
            - VECTOR_INDEXING_COMPLETED
            - READABILITY_CHECK_STARTED
            - READABILITY_CHECK_COMPLETED
            - JOB_SUCCEEDED
            - JOB_FAILED
            - JOB_CANCELLED
        level:
          type: string
          enum: [info, error]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        progress:
          $ref: "#/components/schemas/IndexJobEventProgress"
        createdAt:
          type: string
          format: date-time
    IndexJobCollectionSnapshot:
      type: object
      required: [id, displayName, status]
      properties:
        id:
          type: string
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/CollectionStatus"
    IndexJobListItem:
      type: object
      required: [job, collection]
      properties:
        job:
          $ref: "#/components/schemas/IndexJob"
        collection:
          oneOf:
            - $ref: "#/components/schemas/IndexJobCollectionSnapshot"
            - type: "null"
    IndexJobListResponse:
      type: object
      required: [jobs, nextCursor]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/IndexJobListItem"
        nextCursor:
          type: [string, "null"]
    AuditLogListResponse:
      type: object
      required: [auditLog, nextCursor]
      properties:
        auditLog:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type: [string, "null"]
    SingleJobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/IndexJob"
    JobEventsResponse:
      type: object
      required: [jobId, events]
      properties:
        jobId:
          type: string
        events:
          type: array
          items:
            $ref: "#/components/schemas/IndexJobEvent"
    BulkDeleteJobsRequest:
      type: object
      required: [jobIds]
      additionalProperties: false
      properties:
        jobIds:
          type: array
          minItems: 1
          items:
            type: string
    AuditLogEntry:
      type: object
      required: [timestamp, operation, status]
      properties:
        timestamp:
          type: string
          format: date-time
        collectionId:
          type: [string, "null"]
        operation:
          type: string
        status:
          type: string
        requestId:
          type: [string, "null"]
        userId:
          type: [string, "null"]
        jobId:
          type: [string, "null"]
        physicalCollection:
          type: [string, "null"]
        errorCode:
          type: [string, "null"]
        message:
          type: [string, "null"]
        latencyMs:
          type: [integer, "null"]
        details:
          type: [object, "null"]
          additionalProperties: true
